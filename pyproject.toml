[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",     # line too long (Rich console layouts)
    "E402",     # module level import not at top of file
    "E701",     # multiple statements on one line
    "E741",     # ambiguous variable name
    "B008",     # function call in argument defaults
    "B007",     # loop control variable not used
    "B904",     # raise ... from err
    "SIM105",   # try-except-pass instead of contextlib.suppress
    "SIM112",   # systemd explicitly exports lowercase $container
    "SIM117",   # multiple with statements
    "RUF001",   # ambiguous unicode (Cyrillic UI/tables)
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
    "RUF005",   # iterable unpack instead of concat
    "RUF012",   # mutable class attributes
    "RUF013",   # PEP 484 implicit Optional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "F", "B", "C4", "PIE", "SIM", "ASYNC", "RUF"]
"dpi_detector.py" = ["F401"]
