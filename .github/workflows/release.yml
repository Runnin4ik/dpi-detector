name: Release Multiplatform Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# `cross` is installed from a release tarball and every leg pulls a container, so
# a stall is a real way to lose a runner for six hours. The colour is for the log.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CROSS_VERSION: 0.2.5

jobs:
  # Fails in seconds what would otherwise fail after ninety minutes of building:
  # the tag is what the release page, every `--version` and the installer's own
  # `VERSION` are compared against, and nothing else checks that it names the
  # version in Cargo.toml. A tag pushed without the bump publishes eleven
  # binaries whose banner disagrees with the release they are attached to, and
  # no later step notices — the installers only check that a download reports
  # *a* version, not which one the tag promised.
  #
  # The step is tag-gated rather than the job: a manual dispatch is a build
  # rehearsal, and a skipped job would take every `needs: version` job down with
  # it, leaving dispatch with nothing to do.
  version:
    name: Check the tag against Cargo.toml
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the tag names the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          # `[workspace.package]`: the root manifest is a virtual one, and both
          # crates take their version from it (`version.workspace = true`), so
          # this is the single literal the binaries are built with.
          version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["workspace"]["package"]["version"])' Cargo.toml)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error file=Cargo.toml::tag ${GITHUB_REF_NAME} does not name workspace.package.version ${version}; this release would publish binaries whose --version is not the tag"
            exit 1
          fi
          echo "Release version OK: ${GITHUB_REF_NAME} matches Cargo.toml ${version}"

          # The two installers carry the version as well, and nothing tied them
          # to the crate before this: bump Cargo.toml, tag, and leave `VERSION=`
          # behind, and the release's own installer downloads the *previous*
          # release — and its own verification passes, because what it compares
          # a download against is its own stale constant. `build.rs` reads the
          # version from `CARGO_PKG_VERSION` for exactly this reason; these are
          # the last literals left.
          #
          # Read out of each file rather than assumed: a reworded line has to
          # fail here rather than match nothing and pass.
          check_installer_version() {
            file="$1"
            pattern="$2"
            found="$(sed -n "$pattern" "$file" | head -n 1)"
            if [ -z "$found" ]; then
              echo "::error file=$file::the installer's default version is not where this check looks for it; update the check with the line"
              exit 1
            fi
            if [ "$found" != "${GITHUB_REF_NAME}" ]; then
              echo "::error file=$file::the installer installs ${found}, but this release is ${GITHUB_REF_NAME}"
              exit 1
            fi
          }
          # `[$]{…}` rather than `${…}`: shellcheck reads the latter inside single
          # quotes as a mistaken non-expansion (SC2016), and this is a sed pattern
          # matching a literal `${`.
          check_installer_version install.sh 's/^  VERSION="[$]{DPI_VERSION:-\([^}]*\)}"$/\1/p'
          check_installer_version install.ps1 's/^.*else { "\(.*\)" }$/\1/p'
          echo "Release version OK: both installers install ${GITHUB_REF_NAME}"

  # The two third-party actions below are pinned by commit: a tag can be moved to
  # another commit, and this is the workflow that publishes a release — the
  # `actions/*` ones stay on their major tags, as in `check.yml`.
  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x86_64 (Windows 10, 11, Server)
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            name: dpi-detector-windows-x86_64.exe
            use_cross: false
            use_nightly: false
            smoke: true
            # Static CRT: the exe has to start on a machine with no VC++
            # redistributable, which is the point of a single-file tool.
            rustflags: "-C target-feature=+crt-static"

          # 1b. Windows 7 Legacy x86_64
          - os: windows-2025
            target: x86_64-win7-windows-msvc
            name: dpi-detector-windows-7-x86_64.exe
            use_cross: false
            use_nightly: true
            # The artifact starts on the runner (checked against the released
            # alpha.19 build: `--version` and `--legend` both exit 0 on Windows
            # 11), so this row gets the smoke too — and it is the row with the
            # most moving parts: a nightly toolchain, a std built from source and
            # a static CRT.
            smoke: true
            rustflags: "-C target-feature=+crt-static"
            # No rust-std is published for this target, so std and panic_abort are
            # built from source: the nightly toolchain and `rust-src` the
            # toolchain step installs exist for this row. The nightly is pinned to
            # a date — `-Z build-std` is a nightly feature, and a floating
            # toolchain means this row can break without a commit behind it. Move
            # the pin deliberately, and check the three build-std rows together.
            cargo_args: "+nightly-2026-09-17 -Z build-std=std,panic_abort"
          # 2. Ubuntu / Linux x86_64 (100% static musl)
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            name: dpi-detector-linux-x86_64
            use_cross: false
            smoke: true
            # `panic = "abort"` already leaves our own code without unwind
            # tables; this drops the ones codegen would still emit, for size.
            rustflags: "-C force-unwind-tables=no"

          # 3. ARM64 Routers & SBCs (Keenetic Hopper/Titan 2, Xiaomi AX3000T, Raspberry Pi)
          - os: ubuntu-26.04
            target: aarch64-unknown-linux-musl
            name: dpi-detector-linux-arm64
            use_cross: true
            qemu: aarch64
            # `panic = "abort"` leaves our own code without unwind tables; this
            # drops the ones codegen still emits. Measured on the router (mipsel,
            # same flag, same code): -352 KB of file, and since the resident
            # memory tracks the file at ~85%, about -0.3 MB of RSS.
            rustflags: "-C force-unwind-tables=no"
          # 4. ARM32 Routers (Keenetic Titan 1, Hero, ASUS RT-AX58U, MikroTik ac)
          - os: ubuntu-26.04
            target: armv7-unknown-linux-musleabihf
            name: dpi-detector-linux-armv7
            use_cross: true
            has_upx: true
            qemu: arm
            rustflags: "-C force-unwind-tables=no"

          # 5. MIPS Little-Endian Routers (Keenetic Giga KN-1011, Viva, Xiaomi 3G/4A, MikroTik hEX)
          - os: ubuntu-26.04
            target: mipsel-unknown-linux-musl
            name: dpi-detector-linux-mipsel
            use_cross: true
            has_upx: true
            qemu: mipsel
            # `-Z build-std` (set in Cross.toml for this target) is nightly-only,
            # so this row names the toolchain on the command line instead of
            # using the pinned one.
            use_nightly: true
            cross_args: "+nightly-2026-09-17"
            # `-L` names the alias step's directory as the cross container sees
            # it (the host's `target/` is the container's `/target/`).
            rustflags: "-C target-feature=+crt-static -C force-unwind-tables=no -C link-self-contained=no -L /target/static-unwind-mipsel-unknown-linux-musl"

          # 6. MIPS Big-Endian Routers (TP-Link Archer C7, MikroTik hAP ac lite)
          - os: ubuntu-26.04
            target: mips-unknown-linux-musl
            name: dpi-detector-linux-mips
            use_cross: true
            has_upx: true
            qemu: mips
            use_nightly: true
            cross_args: "+nightly-2026-09-17"
            rustflags: "-C target-feature=+crt-static -C force-unwind-tables=no -C link-self-contained=no -L /target/static-unwind-mips-unknown-linux-musl"
          # 7. macOS Intel. `macos-26-intel` is the x64 image, and building here
          # rather than on the arm64 one is a deliberate trade: measured, the
          # cross-compiled x86_64 build on `macos-26` takes 118–141 s against
          # 244–439 s here, but the matrix runs its legs in parallel, so what the
          # swap buys the workflow is the 22 s between this leg (244 s) and the
          # slowest one left (`windows-7`, 222 s) — while giving up the only
          # native start of the artifact. The arm64 arrangement was run once to
          # check it still works: `macos-26` built it in 137 s and the smoke step
          # passed, so the swap is one line if wall time ever outweighs a native
          # smoke. It is also a dead end: the artifact starts on an arm64 runner
          # only through Rosetta, whose general support ends with macOS 27.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            name: dpi-detector-macos-intel
            use_cross: false
            smoke: true

          # 8. macOS Apple Silicon (M1-M4)
          - os: macos-26
            target: aarch64-apple-darwin
            name: dpi-detector-macos-arm64
            smoke: true

          # 9. Android ARM64 (Termux, ADB, Android 5.0+ phones/tablets)
          - os: ubuntu-26.04
            target: aarch64-linux-android
            name: dpi-detector-android-arm64
            use_cross: true

          # 10. Android ARM32 (Older phones, Smart TVs, Android 5.0+)
          - os: ubuntu-26.04
            target: armv7-linux-androideabi
            name: dpi-detector-android-armv7
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The pinned toolchain comes from `rust-toolchain.toml`: a bare
      # `rustup toolchain install` resolves the channel, the profile and the
      # components from that file (verified — a component listed only there is
      # installed by that command). The target's std is deliberately NOT in the
      # file: listing it would make every clone download std for ten targets, so
      # each row adds its own.
      - name: Install the pinned Rust toolchain
        if: "!matrix.use_nightly"
        run: rustup toolchain install

      - name: Add the build target to it
        if: "!matrix.use_cross && !matrix.use_nightly"
        run: rustup target add ${{ matrix.target }}

      # Three rows cannot use the pin: win7 and the two MIPS targets build std
      # from source with `-Z build-std`, which is nightly-only. They name the
      # toolchain on the command line instead — `cargo +nightly-2026-09-17 …` and
      # `cross +nightly-2026-09-17 …` — and `+toolchain` overrides the pinned
      # file. The date is in four places (here and the three rows): a floating
      # nightly could break them without a commit behind it.
      - name: Install nightly for the build-std rows
        if: matrix.use_nightly
        run: rustup toolchain install nightly-2026-09-17 --profile minimal --component rust-src
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # The one executable the pipeline downloads with no manifest beside it —
      # cross publishes none — so it is pinned by hash as well as by version, and
      # `CROSS_VERSION` keeps this tarball and the container images below in step.
      - name: Install cross binary
        if: matrix.use_cross
        run: |
          _tarball="/tmp/cross-${CROSS_VERSION}.tar.gz"
          curl -fsSL -o "$_tarball" "https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz"
          echo "a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  $_tarball" | sha256sum -c -
          tar -xzf "$_tarball" -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/cross
      # The MIPS musl targets are dynamic by default — rust-std ships no
      # self-contained libc for them, so Cross.toml builds their std from
      # source — and their interpreter (/lib/ld-musl-mipsel-sf.so.1) exists on
      # Entware but not on stock firmwares such as Padavan, where a dynamic
      # binary fails with "/bin/sh: ./dpi-detector: not found". Every other musl
      # target here is static already, so the flags stay on the two that need
      # them: `+crt-static` links libc from the toolchain's sysroot and
      # `link-self-contained=no` stops rustc from looking for the crt objects it
      # does not ship for MIPS. rustc then asks the linker for `-lunwind`, which
      # the musl.cc toolchain does not have: its unwinder is GCC's, in
      # `libgcc_eh.a`, and holds the same `_Unwind_*` symbols. The step below
      # copies that archive under the requested name into the mounted
      # workspace, which `-L` adds to the linker's search path.
      - name: Alias the MIPS unwinder under the name rustc asks for
        if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
        run: |
          mkdir -p "target/static-unwind-${{ matrix.target }}"
          docker run --rm -v "$PWD/target/static-unwind-${{ matrix.target }}:/out" "ghcr.io/cross-rs/${{ matrix.target }}:${CROSS_VERSION}" \
            sh -c 'for cc in /usr/local/bin/*muslsf-gcc; do cp "$(dirname "$($cc -print-libgcc-file-name)")/libgcc_eh.a" /out/libunwind.a; done'
          ls -l "target/static-unwind-${{ matrix.target }}/"

      # Two build steps, one per driver. What differs per target — the RUSTFLAGS
      # it needs and the cargo arguments it needs — lives in the matrix, not in a
      # fourth near-copy of the same step: the four these replace differed only
      # in their `if`, one RUSTFLAGS expression and the cargo arguments, and two
      # of those `if`s had already drifted away from the matrix they mirrored.
      - name: Build with cross
        if: matrix.use_cross
        env:
          # Built from one expression only: the flags used to be assembled with a
          # nested `${{ }}` around `matrix.target`, which GitHub renders verbatim
          # — rustc was handed `${{ matrix.target }}` as three separate arguments
          # and the MIPS build never started. What differs per target lives in
          # the matrix; the two flags every cross build wants stay here.
          RUSTFLAGS: "--cfg rustix_use_libc -C force-unwind-tables=no ${{ matrix.rustflags }}"
        # `--locked` is what the tag is cut from: without it cargo is free to
        # resolve a `Cargo.toml` that disagrees with `Cargo.lock` and ship a
        # dependency set no commit ever built.
        run: cross ${{ matrix.cross_args }} build --release --target ${{ matrix.target }} --locked

      - name: Build with cargo
        if: "!matrix.use_cross"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo ${{ matrix.cargo_args }} build --release --target ${{ matrix.target }} --locked

      - name: Prepare binary artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/dpi-detector.exe dist/${{ matrix.name }}

      - name: Prepare binary artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dpi-detector dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      # The foreign-architecture musl binaries are the artifacts nothing has ever
      # started: `upx -t` unpacks the packed one, and that is all. They are
      # static, so qemu-user runs them as they are — all four arches were checked
      # against the released alpha.19 binaries before this step went in. The
      # Android rows are left out on purpose: their binaries are linked against
      # bionic, which the runner has no sysroot for.
      - name: Smoke the built artifact under qemu
        if: matrix.qemu
        run: |
          sudo apt-get update
          # `qemu-user-static` is a virtual package on Ubuntu 26.04 and installs
          # nothing (`E: Package 'qemu-user-static' has no installation
          # candidate`); `qemu-user` carries `/usr/bin/qemu-<arch>`, which runs a
          # static guest binary just as well. All four arches were checked in this
          # image against the released alpha.19 binaries.
          sudo apt-get install -y --no-install-recommends qemu-user
          "qemu-${{ matrix.qemu }}" "dist/${{ matrix.name }}" --version
          "qemu-${{ matrix.qemu }}" "dist/${{ matrix.name }}" --legend > /dev/null

      # The artifact that ships is built by the one profile nothing else runs
      # under — fat LTO, `opt-level = "z"`, `panic = "abort"` — and no job had
      # ever started one: a binary that links but dies before printing its banner
      # was first seen by whoever ran the installer. `smoke` marks the rows whose
      # artifact the runner can actually start — same architecture as the runner,
      # no container — which excludes the six cross targets and the win7
      # `build-std` row (a second std, built on nightly). `--version` is
      # deliberately the same contract `install.sh` verifies a download with.
      - name: Smoke the built artifact
        if: matrix.smoke
        shell: bash
        run: |
          "./dist/${{ matrix.name }}" --version
          "./dist/${{ matrix.name }}" --legend > /dev/null

      # Pinned to 4.2.4 on purpose, and it is not a stale pin: the UPX 5.x
      # unpacking stub calls `memfd_create` before anything else, and that
      # syscall needs Linux >= 3.17 (October 2014). Router firmwares ship much
      # older kernels, and there a 5.x-packed binary dies with
      # `Trace/breakpoint trap` before the detector's first instruction —
      # measured on a Xiaomi R3P (kernel 3.4.113): `execve` succeeds, the stub
      # makes a couple of syscalls, not one of them a network call, then the
      # kernel raises SIGTRAP. UPX closed exactly that report as "kernel too
      # old" and points at 4.2.4, whose stub works through `/proc/self/exe` and
      # `mmap` instead (upx/upx#904 for mipsel on 3.4, upx/upx#902 for arm32 on
      # 3.14); 4.2.4 packs the same binary to the same ratio (32.0%), and the
      # result runs on both the old kernel and the new one. Do not move this to
      # `latest`, and check both kernels before considering a bump.
      #
      # Before any bump, know what the newer lines cost: every 5.x needs
      # `memfd_create` (Linux >= 3.17) and none of them can be talked out of it,
      # so 3.4 routers lose the compact build entirely. 4.2.4 is also the only
      # version tested that survives an armv7 executable PT_LOAD whose `p_filesz`
      # is an exact multiple of the page size — 3.96 through 4.2.3, and 5.0.2,
      # 5.1.1 and 5.2.0 all pack it into a binary that segfaults at startup,
      # while 4.2.4 runs it (upx/upx#18898; the fix reached 5.2.1). Our own
      # binaries are not in that layout today and pack to the same ratio either
      # way, which is why the pin is free here.
      - name: Set up UPX
        if: matrix.has_upx
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        with:
          version: v4.2.4
          install-only: true

      - name: Create UPX compressed binary
        if: matrix.has_upx
        run: |
          cp dist/${{ matrix.name }} dist/${{ matrix.name }}-upx
          upx --best --lzma dist/${{ matrix.name }}-upx
          # `upx -t` unpacks in memory and compares, so it is
          # architecture-independent — verified with the pinned 4.2.4 packing a
          # mipsel ELF here (`testing … [OK]`) — and it catches the truncated or
          # mis-packed artifact that would otherwise reach a router as a
          # `Trace/breakpoint trap`. What it cannot see is a stub that unpacks
          # cleanly and then dies on the target ABI, which is why the packed
          # file is started for real by the step below.
          upx -t dist/${{ matrix.name }}-upx
          chmod +x dist/${{ matrix.name }}-upx
          ls -lh dist/

      # The packed artifact is the one that has to start on the router, and it
      # was the one nothing had ever started: `upx -t` compares bytes, and the
      # plain binary's smoke says nothing about the stub that replaced its entry
      # point. Every row that packs is a row with a `qemu` in the matrix, and
      # the emulator is already installed by the smoke step above. Measured with
      # the pinned 4.2.4 on a static mipsel musl binary: packed to 30.05%, `upx
      # -t` OK, and both `--version` and `--help` run from the packed file under
      # `qemu-mipsel`.
      - name: Smoke the packed artifact under qemu
        if: matrix.has_upx && matrix.qemu
        run: |
          "qemu-${{ matrix.qemu }}" "dist/${{ matrix.name }}-upx" --version
          "qemu-${{ matrix.qemu }}" "dist/${{ matrix.name }}-upx" --legend > /dev/null

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          # The release job takes them in the same run; a week leaves room for a
          # re-run without keeping every release's binaries for the default 90
          # days.
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # No status-check function here, and that is the point: `success()` is applied
    # implicitly *unless* the condition calls one of them (`!cancelled()`,
    # `success()`, `failure()`, …). With `fail-fast: false`, any of them would let
    # this job publish a release assembled from whichever matrix legs happened to
    # build, with the missing architectures invisible on the release page.
    # Skipping is the failure mode we want: the run names the leg that failed.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: dpi-detector-*
          merge-multiple: true

      # The manifest both installers verify a download against. It travels the
      # same channels as the binaries, so it is an integrity check — a truncated
      # mirror, a proxy that rewrote a byte, a stale CDN copy — and not a
      # signature: neither installer has a key to trust a manifest with, and both
      # still run `--version` on what they install.
      - name: Prepare release files
        run: |
          set -euo pipefail
          cp install.sh release-files/
          cp install.ps1 release-files/
          cd release-files

          # A leg that never uploaded is invisible in the manifest otherwise:
          # `download-artifact` merges whatever arrived, the globs match what is
          # there, and the release ships nine architectures out of eleven with
          # nothing in the log to say so — `fail_on_unmatched_files` only
          # catches a pattern that matches nothing at all. Counted per group so
          # the message names the one that came up short.
          #
          # The numbers are the build matrix: eleven rows, three of which pack a
          # `-upx` variant (`has_upx`). Adding a row means adding it here — that
          # is what this is for. The two installers are copied in above, so
          # `set -e` has already failed the step if either is missing from the
          # checkout.
          shopt -s nullglob
          plain=()
          for file in dpi-detector-*; do
            case "$file" in
              *-upx) ;;
              *) plain+=("$file") ;;
            esac
          done
          packed=(dpi-detector-*-upx)

          problems=''
          [ "${#plain[@]}" -eq 11 ] || problems="${problems} ${#plain[@]}/11 binaries;"
          [ "${#packed[@]}" -eq 3 ] || problems="${problems} ${#packed[@]}/3 packed;"
          if [ -n "$problems" ]; then
            echo "::error::release files are incomplete:$problems a build leg did not upload"
            ls -1
            exit 1
          fi

          # Written elsewhere first: `> SHA256SUMS.txt` would create the file
          # before `*` is expanded, and it would then hash its own empty self.
          sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS.txt"
          mv "${RUNNER_TEMP}/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Created as a draft, and published by the last step of this job. The
      # action creates the release first and uploads into it second, so with
      # `draft: false` a run that dies between the two — a dropped connection, a
      # cancelled job, an upload that fails — leaves a *published* release page
      # carrying part of the set, and the missing architectures are invisible on
      # it. A draft that never gets published is the failure mode we want: the
      # page is empty of consequences until every upload has landed.
      #
      # `generate_release_notes` is a create-time input and `gh release edit`
      # has no equivalent, so the notes are generated here, on the draft.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release-files/*
          draft: true
          # The tag says which line this is: `v5.0.0-alpha.19` is a prerelease,
          # `v5.0.0` is not. A hardcoded `true` would publish the stable line as
          # one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # An asset that never made it is a failed release, not a release with
          # fewer files in it.
          fail_on_unmatched_files: true
          # The release page had no text at all: these are the commits and pull
          # requests between the previous tag and this one.
          generate_release_notes: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
          # Printed because it is the one input above whose effect a draft could
          # change: if the generated notes ever come back empty here, this is
          # where it shows, next to the tag it happened on.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json body --jq '"release body: \(.body | length) characters"'
