name: Release Multiplatform Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: dpi-detector-windows-x86_64.exe
            use_cross: false

          # 2. Ubuntu / Linux x86_64 (100% static musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: dpi-detector-linux-x86_64
            use_cross: false

          # 3. ARM64 Routers & SBCs (Keenetic Hopper/Titan 2, Xiaomi AX3000T, Raspberry Pi)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: dpi-detector-linux-arm64
            use_cross: true

          # 4. ARM32 Routers (Keenetic Titan 1, Hero, ASUS RT-AX58U, MikroTik ac)
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            name: dpi-detector-linux-armv7
            use_cross: true
          # 5. MIPS Little-Endian Routers (Keenetic Giga KN-1011, Viva, Xiaomi 3G/4A, MikroTik hEX)
          - os: ubuntu-latest
            target: mipsel-unknown-linux-musl
            name: dpi-detector-linux-mipsel
            use_cross: true

          # 6. MIPS Big-Endian Routers (TP-Link Archer C7, MikroTik hAP ac lite)
          - os: ubuntu-latest
            target: mips-unknown-linux-musl
            name: dpi-detector-linux-mips
            use_cross: true

          # 7. macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            name: dpi-detector-macos-intel
            use_cross: false

          # 8. macOS Apple Silicon (M1-M4)
          - os: macos-14
            target: aarch64-apple-darwin
            name: dpi-detector-macos-arm64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: "!matrix.use_cross"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust toolchain (for cross)
        if: matrix.use_cross
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross via cargo-binstall
        if: matrix.use_cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --no-confirm cross
      - name: Build with cross (MIPS)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Build with cargo (Native & Pure-Rust targets)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/dpi-detector.exe dist/${{ matrix.name }}

      - name: Prepare binary artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/dpi-detector dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts directory
        run: |
          mkdir -p release-files
          find dist -type f -exec mv -t release-files/ {} +
          ls -la release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
