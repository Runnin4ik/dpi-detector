name: Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental data is ~5 GB of a dev tree here and a runner throws its `target`
  # away at the end of the job, so it is only weight in the cache blob.
  CARGO_INCREMENTAL: 0

# A branch in this repository fires both events for the same tree — `push` and
# `pull_request` — and the two report different refs: a push arrives as
# `refs/heads/rust` and a pull request as `refs/pull/<n>/merge`. Keying the group
# on `github.ref` therefore filed them apart and neither cancelled the other:
# every commit to an open pull request started two full runs that compiled the
# same 258 dependencies. `github.head_ref` (the source branch of a pull request)
# and `github.ref_name` (the short name of a pushed ref) are both `rust` for that
# branch, so one group covers both events for it — which also means a push
# supersedes the run of its own pull request, and a newer push cancels the older
# run instead of queueing behind it. Nothing here is a release path, so
# cancelling is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Third-party actions are pinned by commit — a tag can be moved to another
  # commit, and `softprops/action-gh-release` in the release workflow runs in a
  # job holding `contents: write`. The `actions/*` ones stay on their major tags:
  # they come from the platform the workflow already runs on, and a stale pin is
  # a real cost, since `.github/dependabot.yml` — the thing that moves pins — only
  # takes effect once this file reaches the default branch.
  check:
    name: Test & lint (linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The crates are pure Rust (no C toolchain is needed), so the pinned host
      # toolchain builds the whole workspace.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          # A miss on the exact key — one dependency bumped, so a new
          # `Cargo.lock` — otherwise throws away every artifact the previous key
          # built: measured on the Windows job, where a cold run spends 131 s in
          # `Test` against 12 s when the cache matches. The prefix restores the
          # newest cache of any lockfile instead, and cargo decides what the
          # change invalidated — that is what its fingerprints are for. The
          # toolchain and the linker config are in the key because artifacts built
          # by another rustc cannot be reused at all: cargo recompiles them, so
          # restoring that cache only costs the download.
          restore-keys: ${{ runner.os }}-cargo-

      # `--locked` keeps CI honest about Cargo.lock; the tree is LF (see
      # .gitattributes), but no formatting check runs here — the sources are
      # formatted by hand, and rustfmt's defaults would rewrite 73 of them.
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Intra-doc links are user-visible on docs.rs and nothing checked them:
      # twelve were broken when this step went in, all of them links from public
      # docs to private items. `--no-deps` keeps it to this workspace.
      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --no-deps

      # `install.sh` is the path most users take to this binary, and nothing has
      # ever executed it: the mirror race, the `--version` verification and the
      # install itself all ran for the first time on a user's box. The dev build
      # stands in for the release asset — same file name, same `--version`
      # contract — so this exercises the mechanics end to end: target detection
      # from `uname`, URL construction from `DPI_MIRRORS`, the parallel mirror
      # race, verification of the candidate against the published
      # `SHA256SUMS.txt`, and the atomic install into `DPI_INSTALL_DIR`. A real
      # Linux binary is what gets run, not a stub, so a binary that cannot print
      # `--version` fails the run here too.
      #
      # `DPI_RELEASE_BASE` points the canonical release URL at the fixture, and
      # that is what puts the manifest lookup under test: the manifest is asked
      # of the release and of nothing else, so a fixture that has one and a
      # mirror that does not are not interchangeable.
      - name: Install through install.sh into a temp prefix
        run: |
          set -eu
          fixture=target/install-smoke/releases/latest/download
          mkdir -p "$fixture" target/install-prefix
          cp target/debug/dpi-detector "$fixture/dpi-detector-linux-x86_64"
          (cd "$fixture" && sha256sum dpi-detector-linux-x86_64 > SHA256SUMS.txt)
          python3 -m http.server 8931 --directory target/install-smoke \
            > target/install-smoke/server.log 2>&1 &
          server=$!
          sleep 1
          if ! DPI_RELEASE_BASE=http://127.0.0.1:8931/releases \
               DPI_VERSION=latest \
               DPI_INSTALL_DIR="$PWD/target/install-prefix" \
                 sh install.sh > "$PWD/target/install.log" 2>&1; then
            cat "$PWD/target/install.log"
            exit 1
          fi
          cat "$PWD/target/install.log"
          # An installer that cannot fetch a manifest degrades to a warning and
          # installs anyway, so "it installed" is not proof the checksum path ran.
          # This is: the line is printed only when the file matched the manifest.
          grep -q 'Checksum verified' "$PWD/target/install.log"
          "$PWD/target/install-prefix/dpi-detector" --version

          # A source that answers with another version is refused. The manifest
          # here matches the file it is served with — same binary, copied — so
          # what rejects it is the version comparison alone, which is the check
          # that holds when the release itself cannot be reached and there is no
          # manifest to compare against at all.
          stale=target/install-smoke/releases/download/v0.0.1-stale
          mkdir -p "$stale"
          cp target/debug/dpi-detector "$stale/dpi-detector-linux-x86_64"
          (cd "$stale" && sha256sum dpi-detector-linux-x86_64 > SHA256SUMS.txt)
          if DPI_RELEASE_BASE=http://127.0.0.1:8931/releases \
               DPI_VERSION=v0.0.1-stale \
               DPI_INSTALL_DIR="$PWD/target/install-prefix-stale" \
                 sh install.sh > "$PWD/target/install-stale.log" 2>&1; then
            echo "a source serving another version was accepted"
            cat "$PWD/target/install-stale.log"
            exit 1
          fi
          cat "$PWD/target/install-stale.log"
          grep -q 'served dpi-detector' "$PWD/target/install-stale.log"
          kill "$server" 2>/dev/null || true

      # The same fixture under BusyBox, which is the userland the router targets
      # actually have: the installer's comments are written for it (`command -v`
      # is absent from hush, `wget` there has no `--timeout`). The asset this run
      # serves is a stub, not the dev binary: that binary is linked against the
      # runner's glibc, which the BusyBox image does not carry at that version —
      # the first run of this step failed at the installer's runtime check for
      # exactly that reason, after the checksum had already matched. What it
      # covers is the shell and the applets: `uname`-based target detection, the
      # mirror race, BusyBox `wget`, `sha256sum`, `od`, `du`, and the atomic
      # install. A real binary is what the run above installs.
      - name: Install through install.sh under BusyBox
        run: |
          set -eu
          fixture=target/install-busybox/releases/latest/download
          mkdir -p "$fixture"
          printf '#!/bin/sh\necho "dpi-detector 5.0.0-alpha.19"\n' > "$fixture/dpi-detector-linux-x86_64"
          chmod +x "$fixture/dpi-detector-linux-x86_64"
          (cd "$fixture" && sha256sum dpi-detector-linux-x86_64 > SHA256SUMS.txt)
          python3 -m http.server 8931 --directory target/install-busybox \
            > target/install-busybox/server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          until curl -sf -o /dev/null "http://127.0.0.1:8931/releases/latest/download/SHA256SUMS.txt"; do
            sleep 0.3
          done
          docker run --rm --network host -v "$PWD:/src:ro" \
            -e DPI_RELEASE_BASE=http://127.0.0.1:8931/releases \
            -e DPI_VERSION=latest \
            -e DPI_INSTALL_DIR=/tmp/prefix \
            busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 \
            sh -c 'mkdir -p /tmp/prefix; sh /src/install.sh'

      # One finding in the installer, and it is informational: `set -- $_last_line`
      # splits on purpose, which is what SC2086 asks about.
      - name: Lint the installer
        run: |
          docker run --rm -v "$PWD:/mnt:ro" \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            -s sh --severity=warning /mnt/install.sh

      # Both installers write the same six proxy hosts out by hand, in two
      # languages, and nothing else keeps them in step: a mirror added to one file
      # and forgotten in the other is a source that platform silently cannot
      # reach. Only the lines that build a URL are read, and the hosts are
      # compared as sets — their order is not a contract.
      - name: The two installers agree on their mirror list
        run: |
          set -eu
          hosts() {
            grep -F "$2" "$1" | grep -oE 'https://[^/"]+' | sed 's|https://||' | sort -u
          }
          # shellcheck disable=SC2016
          hosts install.sh '${_gh}' > target/mirrors-sh.txt
          # shellcheck disable=SC2016
          hosts install.ps1 '$gh"' > target/mirrors-ps.txt
          diff -u target/mirrors-sh.txt target/mirrors-ps.txt
          echo "both installers carry $(wc -l < target/mirrors-sh.txt) proxies"

  # The artifact actions are bumped in lockstep with `release.yml`, and that pair
  # is the one thing about them that fails silently: v7 uploads through the
  # "direct upload" path and v8 verifies, on the download side, a hash that only
  # a matching pair produces. A mismatch fails the *release* job, which runs on a
  # tag — this job is the same round trip on every push, over one small file.
  artifacts:
    name: Artifact round-trip
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: round-trip
          path: .github/workflows/check.yml
          # One file, checked in the next step and never read again.
          retention-days: 1

      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: round-trip
          path: round-trip

      - name: Compare
        run: cmp round-trip/check.yml .github/workflows/check.yml

  # `cfg(windows)` is inactive in the ubuntu job, so the Win32 console-mode
  # probe, `write_win32_ansi`, the keyboard layouts and every Windows-specific
  # `system DNS`/route adapter are compiled for the first time by the release
  # matrix, on a tag. This job is where a break in them shows up instead — and it
  # is also the only place the `rust-lld` pin in `.cargo/config.toml` is
  # exercised against a toolchain CI installs.
  windows:
    name: Test & lint (windows)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Channel, profile and components come from `rust-toolchain.toml`: a bare
      # `rustup toolchain install` resolves them from that file, so the version
      # is pinned in one place and this step cannot drift from it.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          # This is the job the prefix in the linux one was measured on.
          restore-keys: ${{ runner.os }}-cargo-

      # The installer smoke below copies `target/debug/dpi-detector.exe`, and
      # `cargo test` does not produce it — it builds the binary crate's *test
      # harness*, not the executable. The linux job builds for the same reason.
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `install.ps1` is the other half of the installer pair and nothing here has
      # ever run it: its mirror list, its manifest lookup and its atomic install
      # were executed by hand once. The fixture is the linux job's shape — the
      # release directory as a source — and `DPI_RELEASE_BASE` points the
      # canonical URL at it, because the installer asks the release for
      # `SHA256SUMS.txt` first and treats an HTTP answer there as final: without
      # that seam it would ask the real GitHub release and check the fixture
      # binary against a published hash. The installed file is compared with the
      # fixture's own hash: an installer that quietly fell back to the real
      # release would otherwise pass this.
      - name: Install through install.ps1 into a temp prefix
        shell: pwsh
        run: |
          $fixture = Join-Path $PWD 'target/install-smoke/releases/latest/download'
          $prefix = Join-Path $PWD 'target/install-prefix'
          New-Item -ItemType Directory -Force -Path $fixture, $prefix | Out-Null
          $asset = Join-Path $fixture 'dpi-detector-windows-x86_64.exe'
          Copy-Item target/debug/dpi-detector.exe $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  dpi-detector-windows-x86_64.exe" | Set-Content -Encoding ascii (Join-Path $fixture 'SHA256SUMS.txt')
          $version = ((& $asset --version) -split '\s+')[-1]

          $server = Start-Process -PassThru -WindowStyle Hidden python -ArgumentList @(
            '-m', 'http.server', '8931', '--directory', (Join-Path $PWD 'target/install-smoke'))
          try {
            $up = $false
            for ($i = 0; $i -lt 60 -and -not $up; $i++) {
              try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 8931)).Close(); $up = $true }
              catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $up) { throw 'the fixture server never accepted a connection' }

            $env:DPI_MIRRORS = 'http://127.0.0.1:8931/releases/latest/download'
            $env:DPI_RELEASE_BASE = 'http://127.0.0.1:8931/releases'
            $env:DPI_VERSION = 'latest'
            $env:DPI_INSTALL_DIR = $prefix
            & pwsh -NoProfile -File install.ps1 --version *> install.log
            $rc = $LASTEXITCODE
            Get-Content install.log
            if ($rc -ne 0) { throw "install.ps1 exited with $rc" }
            # A missing manifest is a warning and an install anyway, so the line
            # below is what proves the checksum path ran at all.
            if (-not (Select-String -Quiet -Path install.log -Pattern 'Checksum verified')) {
              throw 'the checksum path did not run'
            }
            $installed = (Get-FileHash -Algorithm SHA256 (Join-Path $prefix 'dpi-detector.exe')).Hash.ToLower()
            if ($installed -ne $hash) { throw 'the installed file is not the fixture binary' }
            & (Join-Path $prefix 'dpi-detector.exe') --version

            # A 32-bit Windows has no build to run, and is told so before the
            # download rather than after it.
            $savedArch = $env:PROCESSOR_ARCHITECTURE
            $env:PROCESSOR_ARCHITECTURE = 'x86'
            $env:DPI_INSTALL_DIR = Join-Path $PWD 'target/install-prefix-x86'
            & pwsh -NoProfile -File install.ps1 --version *> install-x86.log
            $rc = $LASTEXITCODE
            $env:PROCESSOR_ARCHITECTURE = $savedArch
            Get-Content install-x86.log
            if ($rc -eq 0) { throw 'a 32-bit host was not refused' }
            if (-not (Select-String -Quiet -Path install-x86.log -Pattern 'needs 64-bit Windows')) {
              throw 'a 32-bit host was refused without a reason'
            }

            # The release answers 404 for the manifest while the mirror has one:
            # the manifest is asked of the release and of nothing else, so the
            # install goes ahead on a warning rather than verifying against a
            # mirror's own copy — which is what the check would be worth if it
            # read one.
            $prefixNoManifest = Join-Path $PWD 'target/install-prefix-nomanifest'
            New-Item -ItemType Directory -Force -Path $prefixNoManifest | Out-Null
            $env:DPI_RELEASE_BASE = 'http://127.0.0.1:8931/nothing-here'
            $env:DPI_INSTALL_DIR = $prefixNoManifest
            & pwsh -NoProfile -File install.ps1 --version *> install-nomanifest.log
            $rc = $LASTEXITCODE
            Get-Content install-nomanifest.log
            if ($rc -ne 0) { throw "install.ps1 exited with $rc on a release with no manifest" }
            if (-not (Select-String -Quiet -Path install-nomanifest.log -Pattern 'no SHA256SUMS\.txt')) {
              throw 'a release with no manifest was not reported'
            }
            if (Select-String -Quiet -Path install-nomanifest.log -Pattern 'Checksum verified') {
              throw 'a checksum was claimed for a release with no manifest'
            }

            # A source that answers with another version is refused. The manifest
            # here matches the file it is served with — the same binary, copied —
            # so what rejects it is the version comparison alone: the check that
            # holds when the release cannot be reached and there is no manifest
            # to compare against at all.
            $stale = Join-Path $PWD 'target/install-smoke/releases/download/v0.0.1-stale'
            New-Item -ItemType Directory -Force -Path $stale | Out-Null
            Copy-Item $asset (Join-Path $stale 'dpi-detector-windows-x86_64.exe') -Force
            Copy-Item (Join-Path $fixture 'SHA256SUMS.txt') (Join-Path $stale 'SHA256SUMS.txt') -Force
            $prefixStale = Join-Path $PWD 'target/install-prefix-stale'
            $env:DPI_RELEASE_BASE = 'http://127.0.0.1:8931/releases'
            $env:DPI_VERSION = 'v0.0.1-stale'
            $env:DPI_INSTALL_DIR = $prefixStale
            & pwsh -NoProfile -File install.ps1 --version *> install-stale.log
            $rc = $LASTEXITCODE
            Get-Content install-stale.log
            if ($rc -eq 0) { throw 'a source serving another version was accepted' }
            if (-not (Select-String -Quiet -Path install-stale.log -Pattern 'served dpi-detector')) {
              throw 'a version mismatch was not reported'
            }
            $env:DPI_VERSION = 'latest'

            # A second run of a release that is already installed fetches
            # nothing: the server is stopped first, so a download would fail.
            Stop-Process -Id $server.Id -Force
            $server = $null
            $env:DPI_RELEASE_BASE = 'http://127.0.0.1:8931/releases'
            $env:DPI_VERSION = "v$version"
            $env:DPI_INSTALL_DIR = $prefix
            & pwsh -NoProfile -File install.ps1 --version *> install-current.log
            $rc = $LASTEXITCODE
            Get-Content install-current.log
            if ($rc -ne 0) { throw "install.ps1 exited with $rc on an up-to-date install" }
            if (-not (Select-String -Quiet -Path install-current.log -Pattern 'Already installed')) {
              throw 'an up-to-date install was downloaded again'
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

  policy:
    name: Dependency policy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # `policy-cargo`, not `cargo-policy`: the linux job's fallback is
          # `${{ runner.os }}-cargo-`, which would prefix-match a
          # `…-cargo-policy-…` key and restore this cache — one without
          # `target/`, the half that matters there.
          key: ${{ runner.os }}-policy-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-policy-cargo-

      # Rule 1 (AGENTS.md §2): no C or C++ may enter the build, because the
      # router targets are cross-compiled with toolchains whose C compilers are
      # broken or absent, and `ring` does not target MIPS at all. `cargo tree`
      # answers that against the graph that is actually built — feature- and
      # target-resolved — which a lock-level ban cannot: `ring` and `cc` ARE in
      # Cargo.lock as optional edges of `rustls-webpki` that no build enables
      # (`cargo tree -i ring` prints nothing for every target), so
      # `cargo deny check bans` with `ring` denied would fail on its first run.
      # An empty result is the pass condition; a crate name that is not in the
      # lock at all also prints nothing, which is the right answer for it.
      - name: Enforce the pure-Rust dependency rule
        run: |
          set -eu
          banned="ring aws-lc-rs aws-lc-sys openssl-sys zstd-sys libz-sys libz-ng-sys curl-sys boring-sys boringssl-src cc"
          found=""
          for crate in $banned; do
            tree=$(cargo tree --workspace --target all -e normal,build -i "$crate" 2>/dev/null || true)
            if [ -n "$tree" ]; then
              echo "::error::$crate reached the dependency graph (AGENTS.md Rule 1)"
              echo "$tree"
              found="$found $crate"
            fi
          done
          [ -z "$found" ] || exit 1

      - name: Cache cargo-deny
        id: deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2

      - name: Install cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.20.2 cargo-deny

      # `licenses` is what keeps the shipped binary's obligations landed: the
      # four patched forks in `vendor/` are Apache-2.0/ISC/MIT sources this
      # repository redistributes, and a new dependency under an incompatible
      # licence has to stop the build rather than the release notes. `sources`
      # pins every crate to crates.io — a git dependency would make the router
      # builds unreproducible. `advisories` is the RustSec database: this tool
      # parses bytes from a hostile network (TLS records, DNS responses, zstd
      # certificate frames), so a known vulnerability in a decoder is a defect
      # here, not a housekeeping item.
      - name: Check licences, sources and advisories
        run: cargo deny --locked check licenses sources advisories
