  - "https://api.ipify.org"
  - "https://icanhazip.com"
  - "https://ifconfig.me/ip"

# DoH-эндпоинты Team Cymru (определение ASN/провайдера по IP)
CYMRU_DOH_SERVERS:
  - "https://dns.google/resolve"
  - "https://cloudflare-dns.com/dns-query"

# Эталонные DoH теста 1 — "правда" по запрещённым доменам (сравнение подмены)
DNS_TRUTH_DOH_SERVERS:
  - "https://cloudflare-dns.com/dns-query"
  - "https://dns.google/resolve"
  - "https://dns.quad9.net/dns-query"

# Конкурентность внутри фаз теста 1
DNS_UDP_CONCURRENCY: 15    # одновременные UDP-сокеты
DNS_DOH_CONCURRENCY: 20    # одновременные DoH-запросы
DNS_EGRESS_CONCURRENCY: 10 # одновременные egress-пробы (whoami)
DNS_ASN_CONCURRENCY: 8     # одновременные запросы к Team Cymru

# Файл кэша ASN-имён; null = %TEMP%\dpi_detector_asn_cache.json
ASN_CACHE_FILE: null

# === Тест 3: TCP 16-20KB ===
FAT_CHUNKS_COUNT: 10       # запросов в keepalive-соединении (10 × 4КБ = 40КБ)
FAT_CHUNK_SIZE: 4000       # размер X-Pad на шаг, байт
FAT_CHUNK_DELAY: 0.05      # пауза между шагами, сек
FAT_RANDOM_POOL_SIZE: 100000  # пул случайных байт для X-Pad

# === Тест 4: подбор белых SNI ===
SNI_BATCH_SIZE: 5          # пачка одновременных проверок SNI
SNI_TOP_N: 3               # сколько рабочих SNI искать на одну AS

