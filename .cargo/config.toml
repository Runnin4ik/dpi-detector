# Windows x86_64 build tuning (local and CI).
#
# `rust-lld` ships inside every toolchain at lib/rustlib/<host>/bin/rust-lld.exe,
# so this needs no extra install. The MSVC linker is the single biggest cost of
# a fat-LTO relink: 112 s -> 56 s per edit→build cycle on this workspace.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# The Windows 7 row is the same link under another target name, and it is the
# longest leg of the matrix (216-224 s against 191 s for the row above), so the
# pin applies to it too — verified in a dispatch run: the leg builds, and the
# artifact still starts (`--version` and `--legend` both exit 0 on the runner).
[target.x86_64-win7-windows-msvc]
linker = "rust-lld"

# Rejected here, with the reason, so nobody re-tries them:
#
#   embed-metadata = false  Not a config key on the pinned toolchain: 1.99.0
#                           fails the parse with `expected a table, but found a
#                           boolean for
#                           target.x86_64-pc-windows-msvc.embed-metadata` where
#                           1.98.1 only called it an unused key — which is what
#                           this note recorded first. The lever itself exists as
#                           the nightly-only pair `cargo -Z embed-metadata` /
#                           `rustc -Z embed-metadata=val`, both listed by
#                           nightly-2026-09-17; stable rejects every `-Z`.
#                           Measured for scale: a clean dev build is 1078 MiB, of
#                           which 434 MiB is `.rlib` and 165 MiB `.rmeta` — the
#                           win is a fraction of that, in intermediate artifacts
#                           rather than in the shipped binary, so it does not pay
#                           for a nightly build.
#   sccache, mold           no benefit at one codegen unit with fat LTO, and
#                           mold is ELF-only while these rows link with rust-lld.
