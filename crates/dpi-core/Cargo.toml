[package]
name = "dpi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Never published: this is the engine of a binary that ships as a GitHub release
# artifact. It matters to `deny.toml` — cargo-deny reads the absent version on a
# path-only dependency as a wildcard requirement, and its `allow-wildcard-paths`
# exemption covers private crates only, because crates.io itself rejects a path
# dependency in a publishable one.
publish = false

[features]
# The one test in this workspace that dials the real internet
# (`dns/doh.rs::test_doh_connect_h2` -> `dns.google`). Off by default so that the
# default `cargo test` needs no egress: this tool exists for the networks that
# block DNS to Google, and a runner that blocks or rate-limits it would turn a
# green tree red with no code change. Opt in with
# `cargo test -p dpi-core --features live-network`. No dependency rides on it.
live-network = []

# Experiment: run the QUIC column through `quinn` instead of the hand-written
# Initial. Not a shipping candidate — `quinn` needs a QUIC-capable crypto
# provider, and the only one reachable here is `ring` (assembly, no MIPS target,
# Rule 1) — so this feature exists to measure that cost, not to be enabled.
# `probe/quic_quinn.rs` has the details; off by default (Rule 2).
quinn-probe = ["dep:quinn"]

[dependencies]
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-rustcrypto = { workspace = true }
# Only for the `quinn-probe` experiment; see `[features]` above and
# `probe/quic_quinn.rs`. Deliberately not in `[workspace.dependencies]`: the
# point of the measurement is that this dependency must not reach the workspace.
quinn = { version = "0.11", optional = true }
hyper = { workspace = true }
http2 = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
http-body = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rand = { workspace = true }
ml-kem = { workspace = true }
x25519-dalek = { workspace = true }
p256 = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
brotli-decompressor = { workspace = true }
zlib-rs = { workspace = true }
ruzstd = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
tracing = { workspace = true }
url = "2.5"
# Only for the errno constants the classifier compares against: they are the
# platform's own numbers, and hardcoding them per architecture is how the MIPS
# (and macOS, and SPARC) values got missed. Already in the graph through
# `rustix` and `crossterm`, so this adds no code to the binary.
libc = "0.2"
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# `GetAdaptersAddresses` for the interface list a bind can use: the kernel's own
# answer, already in the graph through tokio, so naming it here adds no build.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Test-only: the round-trip test needs a real encoder to produce the payloads
# `net::cert_compression` has to read. Never linked into a release build.
brotli = "8"

[lints]
workspace = true
