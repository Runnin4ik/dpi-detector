[package]
name = "dpi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-rustcrypto = { workspace = true }
hyper = { workspace = true }
h2 = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rand = { workspace = true }
ml-kem = { workspace = true }
x25519-dalek = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
brotli-decompressor = { workspace = true }
zlib-rs = { workspace = true }
tracing = { workspace = true }
url = "2.5"
# Only for the errno constants the classifier compares against: they are the
# platform's own numbers, and hardcoding them per architecture is how the MIPS
# (and macOS, and SPARC) values got missed. Already in the graph through
# `rustix` and `crossterm`, so this adds no code to the binary.
libc = "0.2"
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Test-only: the round-trip test needs a real encoder to produce the payloads
# `net::cert_compression` has to read. Never linked into a release build.
brotli = "8"
