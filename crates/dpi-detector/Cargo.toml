[package]
name = "dpi-detector"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Never published: a binary crate that ships as a GitHub release asset. Same
# reason as `dpi-core` — `deny.toml`'s wildcard check only exempts a path-only
# dependency in a crate crates.io would refuse to accept it in.
publish = false

[[bin]]
name = "dpi-detector"
path = "src/main.rs"

[dependencies]
dpi-core = { path = "../dpi-core" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `i18n::Language::autodetect` reads the Windows display language.
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Duplicated from `[workspace.lints]` rather than inherited, because Cargo rejects
# a local entry next to `lints.workspace = true` — "cannot override
# `workspace.lints` in `lints`" — and this crate has to add one lint.
[lints.rust]
unreachable_pub = "warn"
# Kept in step with the workspace table by hand for the same reason.
dead_code_pub_in_binary = "warn"

[lints.clippy]
all = "deny"
