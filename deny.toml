# cargo-deny policy, enforced by `.github/workflows/check.yml` (`policy` job).
#
# Four checks run, each answering a question this project has to answer anyway:
#
#   licenses    The repository redistributes two patched forks (`vendor/rustls`,
#               `hyper`, both Apache-2.0/ISC/MIT) and ships their compiled form in
#               every release artifact, so a new dependency under an obligation we
#               cannot meet has to fail here — before it is in a router image —
#               rather than in a release note.
#   sources     Every crate resolves to crates.io. A git dependency (or a second
#               registry) would make the ten cross-built release targets depend on
#               a moving branch, which the MIPS/arm container builds cannot
#               reproduce later.
#   advisories  RustSec. This tool parses bytes from a network that is assumed
#               hostile — TLS records, DNS responses, zstd certificate frames —
#               so a published vulnerability in a decoder is a defect in it.
#   bans        The shape of the resolved lock rather than its licences: a
#               requirement the lock cannot pin, and a crate that appears twice
#               and therefore compiles twice.

[advisories]
version = 2
# A yanked release is not merely old: it was withdrawn, and the lock can pin it
# for years without anyone noticing.
yanked = "deny"
# Empty, and it should stay that way: an entry here claims an advisory is
# unreachable, and cargo-deny warns about every entry it never meets. The two that
# lived here — the RSA timing attack and the unmaintained `paste` — went with the
# `rustls-rustcrypto` provider, which was the only thing in the tree that pulled
# `rsa` and `paste` (docs/PROFILES_AND_PROVIDER.md).
ignore = []

[licenses]
version = 2
# Below this, cargo-deny treats a licence as unknown and asks for a clarification
# instead of guessing from a file name.
confidence-threshold = 0.8
# Permissive licences only. A copyleft dependency in a shipped binary is a
# decision for a human, so it has to arrive as a failed check and be added here
# deliberately, with its obligation spelled out.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Scoped rather than listed above, so the obligation stays visible: webpki-roots
# is Mozilla's root-store *data* (a generated list of trust anchors this tool
# verifies certificates against), published under the Community Data License
# Agreement, which governs data rather than code. A version bump re-opens the
# question here instead of inheriting the answer.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
# A `*` requirement resolves to whatever the registry happens to hold at build
# time, so the lock stops meaning anything: the same commit builds a different
# graph next month, on a router nobody can inspect. Nothing here needs one —
# every requirement in this tree carries a version — so this is a tripwire
# against a dependency added later, not a migration.
#
# The first-run hit is a path dependency inside this workspace (`dpi-core`),
# whose requirement cargo-deny reads as `*` because a path carries no version to
# pin. `allow-wildcard-paths` is what keeps the check aimed at the registry,
# where a `*` really does move.
wildcards = "deny"
allow-wildcard-paths = true
# `warn`, not `deny`: the lock carries duplicated crates through third-party
# edges (`windows-sys` twice among them), and none of them is a requirement this
# repository writes — `deny` would fail on its first run and be deleted again.
# What `warn` buys is the list, and a duplicate that shows up in a diff is a
# dependency that doubled its compiled code.
multiple-versions = "warn"
# The whole reverse-dependency chain per duplicate, so the output names the crate
# that introduced it instead of only the two versions.
highlight = "all"
