[workspace]
resolver = "2"
members = [
    "crates/dpi-core",
    "crates/dpi-detector",
    # The crypto provider is the one vendored crate that IS a member: it performs
    # certificate signature verification, so it has to be built, linted and tested
    # in the configuration that ships. See vendor/rustls-rustcrypto/README-PATCH.md.
    "vendor/rustls-rustcrypto",
]
# The vendored crates are patched upstream sources (see
# vendor/*/README-PATCH.md): rustls with a ClientHello-profile hook, h2 with the
# request shape a browser puts in its h2 preface, and hyper with the two preface
# settings a browser may leave out. They must NOT be workspace members (their
# tests/examples are upstream's, not ours). The provider above is the exception.
exclude = ["vendor/rustls", "vendor/h2", "vendor/hyper"]

# Fingerprint hooks, applied through `[patch]` so that tokio-rustls /
# hyper / hyper-util / rustls-rustcrypto keep resolving to one instance of each.
[patch.crates-io]
rustls = { path = "vendor/rustls" }
h2 = { path = "vendor/h2" }
hyper = { path = "vendor/hyper" }

[workspace.package]
version = "5.0.0-alpha.19"
edition = "2021"
authors = ["runnin"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "macros", "io-util", "sync", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
# RFC 8879 certificate decompression, decoder side only (see
# `dpi_core::net::cert_compression`): rustls's own `brotli`/`zlib` features would
# also link the matching *compressors*, which this tool never calls.
brotli-decompressor = "5"
zlib-rs = "0.6"
# RFC 8878, decoder side only: Firefox advertises `zlib, brotli, zstd` and a
# server may then compress with zstd, which `net::cert_compression` has to read.
# `zstd`/`zstd-safe` wrap the C library and are barred by the pure-Rust rule;
# `ruzstd` is the decoder in Rust (MIT).
ruzstd = "0.8"
# RFC 9180, for the ECH greeting: `net::hpke` is the `Hpke` implementation the
# provider lacks. All three are already in the graph through `rustls-rustcrypto`
# (aes-gcm and chacha20poly1305 for TLS 1.3's AEADs, hkdf through `elliptic-curve`),
# so naming them here compiles nothing new.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false }
hkdf = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# Vendored and patched (the `rustls-webpki 0.102` dependency is gone):
# see vendor/rustls-rustcrypto/README-PATCH.md.
rustls-rustcrypto = { path = "vendor/rustls-rustcrypto" }
webpki-roots = "1.0"
hyper = { version = "1.4", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy", "http1", "http2"] }
# Direct: the probes put a request shape (pseudo-header order, HEADERS priority)
# into the request, which only the patched h2 reads (vendor/h2/README-PATCH.md).
h2 = "0.4"
http-body-util = "0.1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
crossterm = { version = "0.29", features = ["libc", "event-stream"] }
futures-util = { version = "0.3", default-features = false }
comfy-table = { version = "7.1", default-features = false, features = ["custom_styling"] }
unicode-width = "0.2"
rand = "0.8"
ml-kem = "0.3"
x25519-dalek = "2"
# The `channel_id` follow-up signs a P-256 assertion (see `net::follow_up`).
# Already in the graph through `rustls-rustcrypto`, so naming it here compiles
# nothing new.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
thiserror = "1.0"
base64 = "0.22"
sha2 = "0.10"
rustix = { version = "0.38", default-features = false, features = ["use-libc", "termios", "stdio"] }

# The lint posture lives in the manifest, not only on the CI command line, so that
# a bare `cargo build`/`cargo test` — both of which `check.yml` runs — carries it
# too, and so that a single non-default lint has somewhere to be turned on.
# `dpi-core` takes it from here with `[lints] workspace = true`; `dpi-detector`
# has to repeat the table locally, because Cargo refuses a local entry next to
# `workspace = true` and that crate needs one (its manifest says which and why).
# `vendor/rustls-rustcrypto` does not opt in at all: its crate root already
# declares its own table, and upstream's suppressions are upstream's to make.
[workspace.lints.rust]
# `pub` on an item no path from the crate root can reach is a refactor leftover:
# the item is `pub` only because it once was exported. Hoisted from
# `crates/dpi-core/src/lib.rs`, which carried it alone.
unreachable_pub = "warn"
# §11 of the guidelines: `unsafe` is a decision, not a default. Before this the
# tree's 29 blocks were held by review alone — rustc's default is `allow` and
# neither `clippy -D warnings` nor the rustdoc step turns this lint on — so a
# new block in ordinary code compiled everywhere without a word.
#
# `deny` rather than `forbid`, because the blocks are legitimate where they are:
# `net/bind.rs` and `net/icmp_err.rs` in `dpi-core`, and `src/tui/backend.rs` in
# `dpi-detector`, are OS FFI — three modules, not four: `src/terminal.rs` held
# nothing but `detect_vt`, which moved into `backend.rs`. Each is allowed at the
# scope that is FFI — a module-level `#![allow(unsafe_code, reason = "...")]`, or
# one per Win32 function where the file also holds safe code. The `reason` names
# the call and the invariant the scope holds, and every module carries a
# `// SAFETY:` note on every block besides. `forbid` would take that door
# away and break all three at once.
#
# `vendor/rustls-rustcrypto` is a workspace member but does not opt into this
# table, so the patched provider is untouched — which is the point: it is
# upstream's code, and `vendor/rustls` already carries `forbid(unsafe_code)`.
unsafe_code = "deny"
# `dead_code_pub_in_binary` is deliberately NOT set here, though the rule it
# enforces (a `pub` item must not hide dead code in a crate that ships as a
# binary) is one this project wants. `cargo test` compiles every library's test
# target as a *binary harness*, so under `--all-targets` the lint fires on every
# `pub` item a library exports for its dependents — 68 errors in `dpi-core`
# alone, all of them used by `dpi-detector`. The rule is enforced where it can
# hold instead: `crates/dpi-detector/Cargo.toml` sets it in its own table.

[workspace.lints.clippy]
# Equivalent to the `-- -D warnings` the CI clippy step passes — the whole
# `clippy::all` group, which rustc leaves at `warn`. `pedantic` and `nursery` stay
# off deliberately: their 196 members against a `-D warnings` tree fail on the
# first run, and the per-lint entries this project does want are one line each.
#
# `cast_lossless` is the entry that looks like it should be here and is not, so
# the measurement is recorded rather than rediscovered: turning it on today
# reports over thirty sites across a dozen files — the byte and `u16` reads in
# `dns/wire.rs`, `dns/socks.rs`, `dns/dot.rs`, `net/ja3.rs`, `net/ja4.rs`,
# `net/icmp_err.rs`, `net/cert_compression.rs`, `net/fingerprint/variant.rs`,
# `probe/tcp16.rs`, `probe/burst.rs`, the fingerprint tests and
# `examples/tls_fingerprint.rs`, plus the `char as u32` in the i18n and input
# helpers — each of which would have to become `usize::from(..)`. That is a
# rewrite of the parsers for no behaviour change, so the lint stays off until
# those files are touched for another reason.
all = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Local iteration: the codegen knobs of `release` minus the whole-program LTO
# pass, which alone costs ~1.5 min of every edit→build cycle here, plus parallel
# codegen units and rustc's incremental cache. ~7x faster rebuilds at ~46%
# larger binary (6.6 MiB vs 4.5 MiB), so releases still ship `--release`:
#   cargo build --profile release-local --target x86_64-pc-windows-msvc -p dpi-detector
#
# Measured per changed file: 52 s under `release` against 1.28 s here, so
# rebuilding `--release` to "check that it compiles" burns ~40x the time for
# nothing. A no-op `--release` rebuild is 0.45 s — the cost is the LTO relink.
#
# Never alternate flag sets inside one target directory. Cargo keys a unit's
# fingerprint on the full rustc invocation, `RUSTFLAGS` included, so switching
# `+crt-static` on and off — or running `release-local` after a differently
# flagged build of it — recompiles every dependency: measured 88 s for what
# should have been a 1.3 s rebuild. Run the release row exactly as written, in
# the same shell, every time.
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

# `cargo test` and `cargo build` compile 258 locked dependencies before they
# reach a line of ours, and each of them carried full debuginfo: 1.1 GiB of
# rlibs in `target/debug` here, none of it a frame this tool's backtraces need.
# Dependencies drop it; our own crates keep the profile default.
#
# `opt-level` stays at the dev default on purpose. The code whose speed a
# diagnostic run depends on is *ours* — dpi-core and the vendored provider, which
# is a workspace member and therefore not covered by this table — so optimizing
# dependencies would cost edit→test time without addressing the false timeouts
# the dev profile is documented to produce (AGENTS.md, "Development Commands").
# Timing runs belong to `release-local`.
#
# `panic` is deliberately not set here: Cargo ignores it for the test profile, so
# a dev-profile `panic = "abort"` would build the dependency graph twice, once per
# panic strategy. Only `release` sets it.
[profile.dev.package."*"]
debug = false
