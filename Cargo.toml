[workspace]
resolver = "2"
members = [
    "crates/dpi-core",
    "crates/dpi-detector",
]
# Patched upstream sources (see vendor/*/README-PATCH.md): rustls with the
# ClientHello-profile hook, hyper with the header casing a browser writes over
# HTTP/1.1. Not workspace members — their tests and examples are upstream's, and
# a change goes back to the fork, never into the vendored copy.
exclude = ["vendor/rustls", "vendor/hyper"]

# Fingerprint hooks, applied through `[patch]` so that tokio-rustls / hyper /
# hyper-util keep resolving to one instance of each.
[patch.crates-io]
rustls = { path = "vendor/rustls" }
hyper = { path = "vendor/hyper" }

[workspace.package]
version = "5.0.0-alpha.21"
# 2024, from the migration commit: `cargo fix --edition` plus the clippy pass the
# edition unblocked. The fix pass rewrote two shapes — `unsafe extern "system"` in
# the Windows console backend, and `use<>` on `probe::telegram::tls_get`'s two
# RPIT returns, which 2024 would otherwise widen to every in-scope lifetime. The
# clippy pass is the larger half: `collapsible_if` fires on a nested `if let`
# only once let-chains are stable, and it named 42 of them, so they are
# `if let A = x && cond` now. The two POSIX-side ones in `net/sysinfo/os.rs` were
# collapsed by hand — a Windows clippy cannot compile them, and CI's Linux clippy
# would have failed on them.
edition = "2024"
authors = ["runnin"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "macros", "io-util", "sync", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# RFC 8879 decompression, decoder side only (`net::cert_compression`): rustls's
# own `brotli`/`zlib` features would also link the *compressors*, never called.
brotli-decompressor = "5"
zlib-rs = "0.6"
# RFC 8878, same reason: Firefox advertises `zlib, brotli, zstd`, and a server may
# answer with a zstd frame this decoder has to read. `zstd`/`zstd-safe` wrap the C
# library; `ruzstd` is the Rust decoder (MIT) and the only one needed.
ruzstd = "0.8"
# RFC 9180, for the ECH greeting: `net::hpke` is the `Hpke` implementation the
# provider lacks (`ring` is C and brings no Rust AEAD or KDF), so these names are
# what keeps the suites' primitives in the graph.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false }
hkdf = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
webpki-roots = "1.0"
# HTTP/1.1 only: HTTP/2 is the `http2` client below, driven directly, so hyper
# never compiles its own h2 client — which is what left its patch
# (vendor/hyper/README-PATCH.md) with one hunk instead of three.
hyper = { version = "1.4", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# The h2 fork that carries those knobs as published API (h2's own source, MIT);
# its `unstable` feature is what exposes the shape types (`PseudoOrder`,
# `SettingsOrder`, `StreamDependency`). Same lineage as the patch it replaced,
# with nothing to re-apply.
http2 = { version = "0.5", features = ["unstable"] }
http-body-util = "0.1"
# The trait `net::http` implements for both clients' response bodies, read
# through `Limited` by the DoH client.
http-body = "1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
crossterm = { version = "0.29", features = ["libc", "event-stream"] }
futures-util = { version = "0.3", default-features = false }
comfy-table = { version = "7.1", default-features = false, features = ["custom_styling"] }
unicode-width = "0.2"
rand = "0.8"
ml-kem = "0.3"
x25519-dalek = "2"
# The `channel_id` follow-up signs a P-256 assertion (see `net::follow_up`),
# which is where this crate is used.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
thiserror = "1.0"
base64 = "0.22"
sha2 = "0.10"
# The report's own stamp carries the run's local date and time
# (`tui/screens/post_run.rs`), and the offset has to come from the OS: a fixed one
# is wrong across DST, a hand-rolled one is wrong off the platform it was written
# for. `time`, not `chrono` — chrono's `clock` feature pulls a build script
# (`iana-time-zone-haiku`) for a target this tree never ships, while `time` reads
# the offset through `libc::localtime_r` on unix and `SystemTimeToTzSpecificLocalTime`
# on Windows: no build script, the same six fields. `formatting` and `serde`
# stay off — the stamp is six integers, and the feature list is what keeps a date
# crate's formatting tables out of the binary (docs/OPTIMIZATIONS.md).
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

# The lint posture lives in the manifest, not only on the CI command line, so a
# bare `cargo build`/`cargo test` carries it too. `dpi-core` inherits it with
# `[lints] workspace = true`; `dpi-detector` repeats the table locally, because
# Cargo refuses a local entry beside `workspace = true` and it needs one.
[workspace.lints.rust]
# `pub` on an item no path from the crate root can reach is a refactor leftover.
unreachable_pub = "warn"
# §11 of the guidelines: `unsafe` is a decision, not a default. `deny`, not
# `forbid`: the legitimate blocks are OS FFI — `net/bind.rs` and `net/icmp_err.rs`
# in `dpi-core`, `src/tui/backend.rs` in `dpi-detector` — and each is allowed at
# its own scope with a `reason` and a `// SAFETY:` note per block. The vendored
# crates do not opt into this table; `vendor/rustls` carries its own
# `forbid(unsafe_code)`.
unsafe_code = "deny"
# `tail_expr_drop_order` is deliberately absent. It is allow-by-default in 2024 —
# the migration harness force-warns it — and the 35 statements it named during the
# migration were read one by one: a tail `if let`/`match` condition, a
# `for h in handles { h.await }` loop, or a `let _permit = probe::permit(sem).await;`
# followed by a tail `await`. 2024 drops the tail expression's temporaries before
# the block's locals, which holds the permit, the mutex guard or a socket's close
# *longer* than 2021 did, never shorter, and nothing there drops a value a live
# local still needs. No site was rewritten; a future one that does need it will be
# named by the next migration pass rather than silently missed here.
# `dead_code_pub_in_binary` is deliberately NOT set here, though the rule is one
# this project wants: `cargo test` compiles every library's test target as a
# *binary harness*, so under `--all-targets` it fires on every `pub` item a library
# exports for its dependents (68 errors in `dpi-core` alone). It is set where it
# can hold — `crates/dpi-detector/Cargo.toml`.

[workspace.lints.clippy]
# Equivalent to the `-- -D warnings` the CI clippy step passes. `pedantic` and
# `nursery` stay off: their 196 members against a `-D warnings` tree fail on the
# first run, and the per-lint entries wanted here are one line each.
#
# `cast_lossless` is the entry that looks like it belongs here and is not: it
# reports over thirty sites across a dozen files — the byte and `u16` reads in the
# DNS wire/socks/DoT parsers, `net/ja3.rs`, `net/ja4.rs`, `net/icmp_err.rs`,
# `net/cert_compression.rs`, `probe/tcp16.rs`, `probe/burst.rs`, the fingerprint
# tests — each of which would become `usize::from(..)`. A rewrite of the parsers
# for no behaviour change, so it stays off until those files are touched anyway.
all = "deny"

# Desktop and every non-router release row: speed first, and the fastest to build
# — measured, the O3 + thin-LTO build recompiles all ~250 dependencies and still
# finishes before the -Oz + fat-LTO one, because fat LTO is a single whole-program
# pass at link time (docs/PROFILES_AND_PROVIDER.md §7).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# The 32-bit router rows (`armv7`, `mipsel`, `mips`; `release.yml` names it per
# row): CPU first, then RSS, then size. Fat LTO and one codegen unit keep the code
# smallest, and `package.ring` below buys the C compiler a real `-O` — Cargo's
# `OPT_LEVEL` is what reaches `cc`, and `-Oz` would hand it `-Os`.
[profile.release-router]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[profile.release-router.package.ring]
opt-level = 3

# Local iteration: `release`'s codegen knobs minus the LTO pass, plus parallel
# codegen units and rustc's incremental cache.
#   cargo build --profile release-local --target x86_64-pc-windows-msvc -p dpi-detector
#
# Measured per changed file: 53 s under `release` against 1.58 s here, so
# rebuilding `release` to "check that it compiles" burns ~30x the time for nothing.
# The artifact is smaller here too — 6 157 312 B against 6 955 520 B
# (`x86_64-pc-windows-msvc`, `+crt-static`) — because `opt-level = 2` unrolls and
# inlines less than 3 does. Releases ship `release` / `release-router` for speed;
# this profile is the edit→run loop.
#
# Never alternate flag sets inside one target directory: cargo keys a unit's
# fingerprint on the full rustc invocation, `RUSTFLAGS` included, so switching
# `+crt-static` on and off recompiles every dependency — measured 88 s for what
# should have been a 1.3 s rebuild. Run the release row exactly as written.
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

# Line tables only for our own crates, measured: a rebuild after editing
# `dpi-core` takes 3.6 s against 6.0 s with full debuginfo, its rlibs are 140 MiB
# against 617 MiB, and the `.pdb` is half the size — while a backtrace still names
# the function and the line. A debug session that needs locals gets the full
# tables back with `CARGO_PROFILE_DEV_DEBUG=2 cargo build`.
[profile.dev]
debug = 1

# `cargo test` and `cargo build` compile 258 locked dependencies before reaching a
# line of ours, each carrying full debuginfo: 1.1 GiB of rlibs in `target/debug`,
# none of it a frame this tool's backtraces need. Dependencies drop it entirely;
# our own crates keep line tables, from `[profile.dev]` above.
#
# `opt-level` stays at the dev default on purpose: the code a diagnostic run's
# speed depends on is *ours*, which this table does not cover, so optimizing
# dependencies would cost edit→test time without addressing the false timeouts the
# dev profile produces (AGENTS.md). Timing runs belong to `release-local`.
#
# `panic` is deliberately not set here: Cargo ignores it for the test profile, so
# a dev-profile `panic = "abort"` would build the graph twice, once per strategy.
[profile.dev.package."*"]
debug = false
