[workspace]
resolver = "2"
members = [
    "crates/dpi-core",
    "crates/dpi-detector",
]

[workspace.package]
version = "5.0.0-alpha.2"
edition = "2021"
authors = ["runnin"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
webpki-roots = "0.26"
hyper = { version = "1.4", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "cargo"] }
crossterm = { version = "0.28", features = ["libc"] }
comfy-table = { version = "7.1", default-features = false, features = ["custom_styling"] }
unicode-width = "0.2"
rand = "0.8"
arabic_reshaper = "0.4.2"
thiserror = "1.0"
base64 = "0.22"
rustix = { version = "0.38", default-features = false, features = ["use-libc", "termios", "stdio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
